name: 스터디 실습
description: 스터디 일정에 맞춰 Daily Phrase의 오픈웨이트 모델 품질과 추론 효율을 평가·개선합니다.
title: "[스터디] "
labels:
  - study
body:
  - type: dropdown
    id: week
    attributes:
      label: 스터디 주차
      options:
        - "1주차: OT · 로컬 서비스 · 실험 가드레일"
        - "2주차: 하네스 · 데이터셋 · 품질 기준"
        - "3주차: Qwen 중국어 품질 진단 · 기준선 · Jev 평가기"
        - "4주차: Jev 진단 기반 중국어 품질 개선"
        - "5주차: 품질을 유지하는 추론 효율 개선"
        - "6주차: LoRA 등 모델 적응 검증"
        - "7주차: 품질 대비 모델 효율 비교"
        - "8주차: 결과 공유 · 재현성"
        - 기타
    validations:
      required: true
  - type: textarea
    id: daily_phrase_problem
    attributes:
      label: Daily Phrase에서 해결할 문제
      description: 어떤 학습용 모델 출력의 품질이나 추론 병목을 개선하나요?
      placeholder: 예) 중국어 50개 고정 사례에서 원문 근거·문맥 적합성·학습 가치를 평가하고 반복 오류를 찾는다.
    validations:
      required: true
  - type: textarea
    id: study_goal
    attributes:
      label: 이번 주차 목표
      description: 스터디 일정의 산출물과 연결해 적어주세요.
      placeholder: 예) 3주차의 상위 실패 유형 하나를 같은 평가셋으로 개선하고 Jev·사람 판정을 대조한다.
    validations:
      required: true
  - type: textarea
    id: wall
    attributes:
      label: 이번 주차의 벽
      description: 어떤 병목이나 실패를 조사하나요?
      placeholder: "예) 원문 밖 표현, 문맥 부적합, 낮은 학습 가치, Jev와 사람 판정의 불일치"
    validations:
      required: false
  - type: textarea
    id: measurements
    attributes:
      label: 측정할 것
      description: Study.md의 해당 주차 지표를 참고해 품질과 추론 효율을 구분하고, 같은 평가셋·실행 조건을 적어주세요.
      placeholder: "예) 원문·형식 통과율, Jev/사람 항목별 점수와 불일치, 지연·토큰·피크 메모리"
    validations:
      required: false
  - type: textarea
    id: lever
    attributes:
      label: 선택한 손잡이 또는 실험
      description: 비교할 모델 변경이나 실험 변수를 적어주세요.
      placeholder: "예) 프롬프트/검증 변경 · 짧은 학습 예시 · LoRA · 양자화 · 작은 모델 비교"
    validations:
      required: false
  - type: textarea
    id: implementation
    attributes:
      label: 구현 및 검증할 내용
      placeholder: 평가셋, 학습 데이터 분리, 모델·프롬프트 버전, 하네스 지표, 로컬 재현 방법을 적어주세요.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 최소 통과선 및 완료 기준
      description: 주차 표의 최소 통과선을 충족하는지 확인할 수 있게 적어주세요.
      placeholder: "예) 동일 평가셋의 전후 품질 비교, 언어별 결과, p95·메모리 변화, 실행 재현 정보"
    validations:
      required: true
  - type: textarea
    id: baseline
    attributes:
      label: 기준선 및 다음 확인 사항 (선택)
      description: 모델 아티팩트, 프롬프트 revision, 데이터셋 버전과 실험 환경을 기록하세요. 개선되지 않은 결과와 실패 원인도 다음 실험을 위해 남깁니다.
      placeholder: 모델 digest, 데이터셋·결과 파일 위치, PR 또는 실행 환경
    validations:
      required: false
