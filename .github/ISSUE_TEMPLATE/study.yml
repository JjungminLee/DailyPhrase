name: 스터디 실습
description: 스터디 일정에 맞춰 Daily Phrase 기능을 만들고 검증합니다.
title: "[스터디] "
labels:
  - study
body:
  - type: dropdown
    id: week
    attributes:
      label: 스터디 주차
      options:
        - "1주차: OT · 로컬 서비스 · 실험 가드레일"
        - "2주차: 하네스 · 데이터셋 · 품질 기준"
        - "3주차: 기능 동결 · 기준선 · 황금 신호"
        - "4주차: 추론 지연 · 긴 입력 · 모델 로딩"
        - "5주차: 품질 · LoRA · 로컬 자원 비용"
        - "6주차: 동시성 · 모델 API 포화"
        - "7주차: 안정성 · 재시도 · 복구"
        - "8주차: 결과 공유 · 재현성"
        - 기타
    validations:
      required: true
  - type: textarea
    id: daily_phrase_problem
    attributes:
      label: Daily Phrase에서 해결할 문제
      description: 어떤 사용 흐름이나 학습 경험을 개선하나요?
      placeholder: 예) 기사에서 뽑은 표현이 원문에 실제로 있는지 입력 20건으로 확인한다.
    validations:
      required: true
  - type: textarea
    id: study_goal
    attributes:
      label: 이번 주차 목표
      description: 스터디 일정의 산출물과 연결해 적어주세요.
      placeholder: 예) 자기 입력 20건을 준비하고, 원문 포함률을 품질 기준으로 정한다.
    validations:
      required: true
  - type: textarea
    id: wall
    attributes:
      label: 이번 주차의 벽
      description: 어떤 병목이나 실패를 조사하나요?
      placeholder: "예) 긴 입력에서 p95 지연이 튀거나, 평가셋에서 원문에 없는 표현을 생성한다."
    validations:
      required: false
  - type: textarea
    id: measurements
    attributes:
      label: 측정할 것
      description: Study.md의 해당 주차 지표를 참고해 품질과 추론 효율을 구분하고, 같은 평가셋·실행 조건을 적어주세요.
      placeholder: "예) 원문 근거 일치율, 언어별 품질 점수, p50·p95 지연, 피크 메모리"
    validations:
      required: false
  - type: textarea
    id: lever
    attributes:
      label: 선택한 손잡이 또는 실험
      description: 비교할 모델 변경이나 실험 변수를 적어주세요.
      placeholder: "예) 프롬프트 수정 · 학습 예시 보강 · LoRA · 양자화 · 동시성 상한"
    validations:
      required: false
  - type: textarea
    id: implementation
    attributes:
      label: 구현 및 검증할 내용
      placeholder: 평가셋, 학습 데이터 분리, 모델·프롬프트 버전, 하네스 지표, 로컬 재현 방법을 적어주세요.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 최소 통과선 및 완료 기준
      description: 주차 표의 최소 통과선을 충족하는지 확인할 수 있게 적어주세요.
      placeholder: "예) 동일 평가셋의 전후 품질 비교, 언어별 결과, p95·메모리 변화, 실행 재현 정보"
    validations:
      required: true
  - type: textarea
    id: baseline
    attributes:
      label: 기준선 및 다음 확인 사항 (선택)
      description: 모델 아티팩트, 프롬프트 revision, 데이터셋 버전과 실험 환경을 기록하세요. 개선되지 않은 결과와 실패 원인도 다음 실험을 위해 남깁니다.
      placeholder: 모델 digest, 데이터셋·결과 파일 위치, PR 또는 실행 환경
    validations:
      required: false
